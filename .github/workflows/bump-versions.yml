name: Release Changed Plugins And Workflows

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'workflows/**'
      - '.claude-plugin/marketplace.json'
      - '.athena-workflow/marketplace.json'
      - 'scripts/bump-versions.sh'
      - 'scripts/build-plugin-artifacts.mjs'

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Bump changed plugin and workflow versions
        run: bash scripts/bump-versions.sh

      - name: Collect changed plugins
        id: collect_plugins
        shell: bash
        run: |
          changed_plugins="$(
            git diff --name-only -- \
              plugins/*/package.json \
              plugins/*/.claude-plugin/plugin.json \
              plugins/*/.codex-plugin/plugin.json \
            | awk -F/ '/^plugins\/[^/]+\// {print $2}' \
            | sort -u
          )"

          if [ -z "$changed_plugins" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo 'plugin_list<<EOF'
            printf '%s\n' "$changed_plugins"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Validate changed plugin packages
        if: steps.collect_plugins.outputs.changed == 'true'
        shell: bash
        run: |
          while IFS= read -r plugin; do
            [ -n "$plugin" ] || continue
            echo "Packing $plugin..."
            (cd "plugins/$plugin" && npm pack --dry-run)
          done <<'EOF'
          ${{ steps.collect_plugins.outputs.plugin_list }}
          EOF

      - name: Publish changed plugins to npm
        if: steps.collect_plugins.outputs.changed == 'true'
        shell: bash
        run: |
          # Attempt every changed plugin independently. A single plugin's failure
          # (e.g. a brand-new scoped package the NPM_TOKEN cannot create, which npm
          # reports as a 404 on PUT) must NOT abort the loop and starve the plugins
          # queued behind it — that is how one new package silently blocked an
          # existing plugin's release. Collect outcomes and fail at the end.
          set +e
          published=()
          skipped=()
          failed=()
          while IFS= read -r plugin; do
            [ -n "$plugin" ] || continue
            pkg_name="$(node -p "require('./plugins/$plugin/package.json').name")"
            pkg_version="$(node -p "require('./plugins/$plugin/package.json').version")"

            # Idempotent re-runs: if this exact version is already on the registry,
            # skip it rather than failing on npm's EPUBLISHCONFLICT.
            if npm view "${pkg_name}@${pkg_version}" version >/dev/null 2>&1; then
              echo "Skipping ${pkg_name}@${pkg_version} — already published."
              skipped+=("${pkg_name}@${pkg_version}")
              continue
            fi

            echo "Publishing ${pkg_name}@${pkg_version}..."
            if (cd "plugins/$plugin" && npm publish --access public --provenance); then
              published+=("${pkg_name}@${pkg_version}")
            else
              echo "::error::Failed to publish ${pkg_name}@${pkg_version}. If npm reported a 404 on PUT, this is a new package the NPM_TOKEN cannot create — grant the token publish access to ${pkg_name} (or first-publish it manually), then re-run."
              failed+=("${pkg_name}@${pkg_version}")
            fi
          done <<'EOF'
          ${{ steps.collect_plugins.outputs.plugin_list }}
          EOF

          echo "Published: ${published[*]:-(none)}"
          echo "Skipped (already published): ${skipped[*]:-(none)}"
          echo "Failed: ${failed[*]:-(none)}"
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::${#failed[@]} plugin(s) failed to publish: ${failed[*]}"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published tarballs are fetchable
        if: steps.collect_plugins.outputs.changed == 'true'
        shell: bash
        run: |
          # Guards against npm's metadata-vs-tarball inconsistency: occasionally
          # `npm publish` succeeds and registers metadata but the tarball never
          # lands on the CDN, leaving the package uninstallable. Catch it here
          # rather than at user `npm install` time.
          #
          # BOTH the metadata lookup (`npm view … dist.tarball`) and the tarball
          # fetch are retried: right after a publish npm's read replica can lag,
          # returning an empty tarball URL for a few seconds. Retrying only the
          # fetch (not the lookup) made this step false-fail on that propagation
          # race even though the publish had succeeded.
          fail=0
          while IFS= read -r plugin; do
            [ -n "$plugin" ] || continue
            pkg_name="$(node -p "require('./plugins/$plugin/package.json').name")"
            pkg_version="$(node -p "require('./plugins/$plugin/package.json').version")"
            echo "Verifying ${pkg_name}@${pkg_version}..."
            ok=0
            last=""
            for attempt in 1 2 3 4 5 6; do
              tarball_url="$(npm view "${pkg_name}@${pkg_version}" dist.tarball 2>/dev/null)"
              if [ -z "$tarball_url" ]; then
                last="registry has no tarball URL yet"
                echo "  attempt ${attempt}: ${last} — retrying in $((attempt * 5))s"
                sleep $((attempt * 5))
                continue
              fi
              status="$(curl -sS -o /dev/null -w '%{http_code}' -I "$tarball_url" || echo "000")"
              if [ "$status" = "200" ]; then
                echo "  attempt ${attempt}: HTTP 200 OK -> ${tarball_url}"
                ok=1
                break
              fi
              last="tarball HTTP ${status}"
              echo "  attempt ${attempt}: ${last} — retrying in $((attempt * 5))s"
              sleep $((attempt * 5))
            done
            if [ "$ok" != "1" ]; then
              echo "::error::${pkg_name}@${pkg_version} is not verifiably published after retries (last: ${last}). npm registered metadata but the tarball is not retrievable — re-run the workflow or push a trivial change to force a republish."
              fail=1
            fi
          done <<'EOF'
          ${{ steps.collect_plugins.outputs.plugin_list }}
          EOF
          exit "$fail"

      # Commit the version bumps LAST — only after publish and verify have both
      # succeeded. If publishing fails (e.g. a token that cannot write to the
      # scope), every step below the failure is skipped, so the bumped versions
      # and cascaded pins are never pushed to main. This keeps main from drifting
      # ahead of npm — pinning a workflow to a version that was never published.
      # `npm publish` reads the working-tree package.json (already bumped in the
      # first step), so publishing before committing is safe. Workflow-only bumps
      # (no plugin changed → Publish/Verify skip as success) still land here.
      - name: Commit version bumps
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore: auto-bump versions [skip ci]"
            git pull --rebase origin main
            git push
          fi
